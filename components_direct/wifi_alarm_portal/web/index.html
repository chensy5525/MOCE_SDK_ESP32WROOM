<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6be8">
  <title>MOCE 闹钟小车</title>
  <style>
    :root{color-scheme:light;--brand:#0b6be8;--brand-dark:#074fb4;--brand-soft:#eaf3ff;--bg:#f4f7fb;--card:#fff;--line:#dce5f0;--text:#092443;--muted:#66788d;--green:#149466;--green-soft:#e9f8f2;--red:#d83b4b;--red-soft:#fff0f2;--shadow:0 12px 32px rgba(28,72,120,.09)}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eaf3ff 0,#f4f7fb 240px);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}button,input,label{-webkit-tap-highlight-color:transparent}main{width:min(100%,680px);margin:auto;padding:0 16px 36px}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;box-shadow:0 6px 14px rgba(11,107,232,.24)}.online{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.online::before{content:"";width:7px;height:7px;border-radius:50%;background:#20b77a;box-shadow:0 0 0 4px rgba(32,183,122,.12)}
    .hero{padding:20px 4px 12px}.eyebrow{margin:0 0 7px;color:var(--brand);font-size:12px;font-weight:800;letter-spacing:.12em}.hero h1{margin:0;font-size:clamp(28px,8vw,38px);line-height:1.15;letter-spacing:-.04em}.hero p{margin:9px 0 0;color:var(--muted);line-height:1.55}
    .card{margin:14px 0;padding:20px;border:1px solid rgba(194,210,227,.8);border-radius:20px;background:rgba(255,255,255,.96);box-shadow:var(--shadow)}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.card h2{margin:0;font-size:18px;letter-spacing:-.02em}.card-subtitle{margin:4px 0 0;color:var(--muted);font-size:12px}.badge{padding:6px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:800;white-space:nowrap}
    .status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{min-height:78px;padding:13px;border:1px solid #e5edf6;border-radius:14px;background:#f8fbff}.label{display:block;margin-bottom:7px;color:var(--muted);font-size:11px;font-weight:600}.value{display:block;overflow-wrap:anywhere;font-size:14px;font-weight:750;line-height:1.35}.value.good{color:var(--green)}.value.alert{color:var(--red)}
    .field-label{display:block;margin-bottom:8px;color:var(--muted);font-size:12px;font-weight:700}input[type=time]{width:100%;height:64px;padding:0 16px;border:1.5px solid var(--line);border-radius:14px;outline:0;background:#f8fbff;color:var(--text);font-size:28px;font-weight:750;letter-spacing:.02em;transition:.2s}input[type=time]:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(11,107,232,.1)}
    .section-label{margin:18px 0 9px;color:var(--muted);font-size:12px;font-weight:700}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{position:relative}.day input{position:absolute;width:1px;height:1px;opacity:0}.day span{display:grid;place-items:center;aspect-ratio:1;min-height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;transition:.18s}.day input:checked+span{border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:0 5px 12px rgba(11,107,232,.2)}.day input:focus-visible+span{outline:3px solid rgba(11,107,232,.2);outline-offset:2px}
    .settings{margin-top:18px;border-top:1px solid #e8eef5}.toggle{display:flex;align-items:center;justify-content:space-between;min-height:58px;border-bottom:1px solid #e8eef5;font-weight:650}.switch{position:relative;width:46px;height:26px;flex:0 0 auto}.switch input{position:absolute;opacity:0}.slider{position:absolute;inset:0;border-radius:999px;background:#ccd8e5;cursor:pointer;transition:.2s}.slider::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(9,36,67,.22);transition:.2s}.switch input:checked+.slider{background:var(--brand)}.switch input:checked+.slider::after{transform:translateX(20px)}.switch input:focus-visible+.slider{outline:3px solid rgba(11,107,232,.2);outline-offset:2px}
    button{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin-top:14px;padding:0 16px;border:0;border-radius:13px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 7px 16px rgba(11,107,232,.2);transition:transform .15s,background .15s,opacity .15s}button:hover{background:var(--brand-dark)}button:active{transform:translateY(1px)}button.secondary{border:1px solid #bcd3ee;background:#fff;color:var(--brand);box-shadow:none}button.secondary:hover{background:var(--brand-soft)}button.danger{border:1px solid #f2c3c9;background:var(--red-soft);color:var(--red);box-shadow:none}button.danger:hover{background:#ffe4e8}button:disabled{cursor:not-allowed;opacity:.55;transform:none}
    #message:empty{display:none}#message{margin-top:14px;padding:11px 13px;border-radius:11px;font-size:13px;font-weight:650;line-height:1.45}.ok{background:var(--green-soft);color:var(--green)}.error{background:var(--red-soft);color:var(--red)}.hint{margin:14px 0 0;color:var(--muted);font-size:11px;line-height:1.55}.footer{text-align:center;color:#8a9aad;font-size:11px;padding:8px 0}
    @media(max-width:420px){main{padding-inline:12px}.card{padding:17px;border-radius:18px}.item{min-height:72px;padding:11px}.week{gap:5px}.day span{min-height:39px;border-radius:10px}.online span{display:none}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<main>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">M</span><span>MOCE</span></div>
    <div class="online"><span>ESP32 本地控制</span></div>
  </header>
  <section class="hero">
    <p class="eyebrow">ALARM CAR CONTROL</p>
    <h1>闹钟小车</h1>
    <p>设置唤醒计划，管理本次响铃与小车触发状态。</p>
  </section>
  <section class="card">
    <div class="card-head"><div><h2>设备状态</h2><p class="card-subtitle">实时读取 ESP32 运行状态</p></div><span class="badge">LOCAL AP</span></div>
    <div class="status">
      <div class="item"><span class="label">ESP32 时间</span><span id="clock" class="value">--</span></div>
      <div class="item"><span class="label">同步状态</span><span id="synced" class="value">--</span></div>
      <div class="item"><span class="label">闹钟方案</span><span id="summary" class="value">--</span></div>
      <div class="item"><span class="label">触发状态</span><span id="ringing" class="value">--</span></div>
    </div>
    <button id="sync" class="secondary" type="button">同步手机时间</button>
  </section>
  <section class="card">
    <div class="card-head"><div><h2>闹钟计划</h2><p class="card-subtitle">当前调试版本支持 1 个计划</p></div><span class="badge">PLAN 01</span></div>
    <form id="form">
      <label class="field-label" for="time">响铃时间</label>
      <input id="time" type="time" value="07:00" required>
      <p class="section-label">重复日期</p>
      <div class="week">
        <label class="day"><input name="day" type="checkbox" value="0"><span>一</span></label>
        <label class="day"><input name="day" type="checkbox" value="1"><span>二</span></label>
        <label class="day"><input name="day" type="checkbox" value="2"><span>三</span></label>
        <label class="day"><input name="day" type="checkbox" value="3"><span>四</span></label>
        <label class="day"><input name="day" type="checkbox" value="4"><span>五</span></label>
        <label class="day"><input name="day" type="checkbox" value="5"><span>六</span></label>
        <label class="day"><input name="day" type="checkbox" value="6"><span>日</span></label>
      </div>
      <div class="settings">
        <label class="toggle"><span>重复闹钟</span><span class="switch"><input id="repeat" type="checkbox" checked><span class="slider"></span></span></label>
        <label class="toggle"><span>启用闹钟</span><span class="switch"><input id="enabled" type="checkbox"><span class="slider"></span></span></label>
      </div>
      <button id="save" type="submit">保存闹钟计划</button>
    </form>
    <p class="hint">计划会保存到 ESP32 掉电存储。设备重启后需重新连接网页同步手机时间。</p>
  </section>
  <section class="card">
    <div class="card-head"><div><h2>本次响铃</h2><p class="card-subtitle">只停止当前事件，不影响下次重复计划</p></div></div>
    <button id="stop" class="danger" type="button">停止本次响铃</button>
    <div id="message"></div>
  </section>
  <footer class="footer">MOCE Embedded Control · Local Device Portal</footer>
</main>
<script>
"use strict";
const api={status:"/api/v1/status",alarm:"/api/v1/alarm/0",sync:"/api/v1/time/sync",stop:"/api/v1/alarm/stop"};
const el=id=>document.getElementById(id), days=["周一","周二","周三","周四","周五","周六","周日"];
function message(text,ok){el("message").textContent=text;el("message").className=ok?"ok":"error"}
async function request(url,options={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);try{const r=await fetch(url,{...options,cache:"no-store",headers:{"Accept":"application/json",...(options.body?{"Content-Type":"application/json"}:{})},signal:c.signal});const v=await r.json();if(!r.ok||v.ok!==true)throw new Error(v.error||("HTTP "+r.status));return v}finally{clearTimeout(t)}}
function alarmText(a){const selected=[];for(let bit=0;bit<7;bit++)if(a.weekday_mask&(1<<bit))selected.push(days[bit]);return String(a.hour).padStart(2,"0")+":"+String(a.minute).padStart(2,"0")+" · "+selected.join("、")+" · "+(a.repeat?"重复":"单次")+" · "+(a.enabled?"启用":"停用")}
function render(v,updateForm=false){const a=v.alarm,summary=alarmText(a);el("clock").textContent=v.clock_synced?new Date(v.epoch_seconds*1000).toLocaleString():"等待手机同步";el("synced").textContent=v.clock_synced?"已同步":"未同步";el("synced").className="value "+(v.clock_synced?"good":"alert");el("summary").textContent=summary;el("ringing").textContent=v.ringing?"正在响铃":"待机";el("ringing").className="value "+(v.ringing?"alert":"good");if(updateForm){el("time").value=String(a.hour).padStart(2,"0")+":"+String(a.minute).padStart(2,"0");document.querySelectorAll("[name=day]").forEach(x=>x.checked=Boolean(a.weekday_mask&(1<<Number(x.value))));el("repeat").checked=a.repeat;el("enabled").checked=a.enabled}}
const delay=milliseconds=>new Promise(resolve=>setTimeout(resolve,milliseconds));
async function status(){return request(api.status)}
async function pollStatusUntil(predicate,failure){let latest;for(let attempt=0;attempt<10;attempt++){latest=await status();if(predicate(latest))return latest;if(attempt<9)await delay(200)}throw new Error(failure)}
async function load(updateForm=false){try{render(await status(),updateForm)}catch(e){message("读取失败："+e.message,false)}}
async function syncClock(show=true){const d=new Date(),payload={epoch_seconds:Math.floor(d.getTime()/1000),utc_offset_minutes:-d.getTimezoneOffset()};el("sync").disabled=true;try{await request(api.sync,{method:"POST",body:JSON.stringify(payload)});const v=await pollStatusUntil(x=>x.clock_synced&&x.utc_offset_minutes===payload.utc_offset_minutes,"设备未在限定时间内完成时钟同步");render(v,false);if(show)message("时间同步成功",true)}catch(e){if(show)message("时间同步失败："+e.message,false)}finally{el("sync").disabled=false}}
el("form").onsubmit=async e=>{e.preventDefault();const p=el("time").value.split(":");let mask=0;document.querySelectorAll("[name=day]:checked").forEach(x=>mask|=1<<Number(x.value));if(el("enabled").checked&&mask===0){message("启用闹钟时至少选择一天",false);return}const payload={schedule_id:0,hour:Number(p[0]),minute:Number(p[1]),weekday_mask:mask,repeat:el("repeat").checked,enabled:el("enabled").checked};el("save").disabled=true;try{await request(api.alarm,{method:"PUT",body:JSON.stringify(payload)});const v=await pollStatusUntil(x=>Object.keys(payload).every(key=>x.alarm[key]===payload[key]),"设备回读参数与提交内容不一致");render(v,true);message("闹钟已保存并写入掉电存储",true)}catch(err){message("保存失败："+err.message,false)}finally{el("save").disabled=false}};
el("sync").onclick=()=>syncClock(true);el("stop").onclick=async()=>{el("stop").disabled=true;try{await request(api.stop,{method:"POST"});const v=await pollStatusUntil(x=>!x.ringing,"设备未在限定时间内停止本次响铃");render(v,false);message("已停止本次响铃",true)}catch(e){message("停止失败："+e.message,false)}finally{el("stop").disabled=false}};
(async()=>{await syncClock(false);await load(true);setInterval(()=>load(false),3000)})();
</script>
</body>
</html>
